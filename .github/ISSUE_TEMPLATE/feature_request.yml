name: Capability request
description: Propose a new market connector, hardware integration or engine capability.
title: "[Request] "
labels: ["request"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Market connector, Hardware integration, Execution engine, Risk controls, Telemetry / HUGINN, Deployment / Linux, Reporting]
    validations: { required: true }
  - type: textarea
    id: need
    attributes: { label: Operational need, description: What problem does this solve on your site? }
    validations: { required: true }
  - type: input
    id: scale
    attributes: { label: Site scale, placeholder: "e.g. 40 PH/s, 120 units" }
  - type: textarea
    id: notes
    attributes: { label: Additional context }
